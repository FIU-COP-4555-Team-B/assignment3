name: PDF Build

on:
  push:
    paths:
      - doc/*.typ
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Typst
        run: sudo snap install typst

      - name: Typst Compile
        run: typst compile doc/main.typ assignment3.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v7
        with:
          name: assignment3-pdf
          path: assignment3.pdf
