name: C# Impl Build & Test

on:
  push:
    paths:
      - src/csharp/**
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build & Test C# Implementation
        run: dotnet run --project src/csharp/Assignment3.csproj
